name: m3-3820-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  probe-3820:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Find direct references to 0x3820
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/reference.md').read_bytes()
          patterns={
              'JSR abs.l 0x3820': bytes.fromhex('4eb900003820'),
              'JMP abs.l 0x3820': bytes.fromhex('4ef900003820'),
          }
          for label, pat in patterns.items():
              hits=[]
              pos=0
              while True:
                  pos=data.find(pat,pos)
                  if pos<0: break
                  hits.append(pos)
                  pos+=1
              print(label, 'count=', len(hits), 'offsets=', ','.join(f'0x{x:06x}' for x in hits))
          PY

      - name: Install m68k binutils
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble bounded window around 0x3820
        shell: bash
        run: |
          set -euo pipefail
          m68k-linux-gnu-objdump \
            -D -b binary -m m68k:68000 \
            --adjust-vma=0 \
            --start-address=0x37e0 \
            --stop-address=0x3980 \
            /tmp/reference.md
