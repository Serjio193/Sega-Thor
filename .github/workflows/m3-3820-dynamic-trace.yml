name: m3-3820-dynamic-trace

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  trace-original-decompressor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Prepare original routine and representative streams
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          Path('/tmp/decompress.bin').write_bytes(rom[0x3820:0x3b3e])
          cases=[
              ('a',0x16943c,0x3a7fe,0xff316c),
              ('b',0x141580,0x3e820,0xff2fa8),
          ]
          for name,src,caller,dst in cases:
              Path(f'/tmp/source_{name}.bin').write_bytes(rom[src:src+0x10000])
              print(f'case_{name}: caller=0x{caller:x} source=0x{src:x} dest=0x{dst:x} source_byte_2={rom[src+2]}')
          PY

      - name: Install M68K compiler and QEMU user emulator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-m68k-linux-gnu binutils-m68k-linux-gnu qemu-user

      - name: Build isolated M68K harness around original routine bytes
        shell: bash
        run: |
          cat >/tmp/harness.S <<'ASM'
          .section .text
          .global _start

          /* Execute one case. Inputs: A0=source, D7=case id. */
          run_case:
              lea output_data,%a1
              move.l %a0,%a3
              move.l %a1,%a4
              move.l %d7,%a6
              jsr original_decompressor
              move.l %a6,%d7

              move.l %a0,%d4
              sub.l %a3,%d4
              move.l %a1,%d5
              sub.l %a4,%d5

              lea metadata,%a5
              move.l #0x54485232,(%a5)
              move.l %d7,4(%a5)
              move.l %d5,8(%a5)
              move.l %d4,12(%a5)

              move.l #4,%d0
              move.l #1,%d1
              move.l %a5,%d2
              move.l #16,%d3
              trap #0

              move.l #4,%d0
              move.l #1,%d1
              move.l %a4,%d2
              move.l %d5,%d3
              trap #0
              rts

          _start:
              lea source_a,%a0
              moveq #1,%d7
              bsr run_case

              lea source_b,%a0
              moveq #2,%d7
              bsr run_case

              move.l #1,%d0
              clr.l %d1
              trap #0

          .align 2
          original_decompressor:
              .incbin "/tmp/decompress.bin"

          .section .rodata
          .align 2
          source_a:
              .incbin "/tmp/source_a.bin"
          source_b:
              .incbin "/tmp/source_b.bin"

          .section .bss
          .align 4
          output_data:
              .skip 2097152
          metadata:
              .skip 16
          ASM
          m68k-linux-gnu-gcc -nostdlib -static -Wl,-e,_start -o /tmp/harness-m68k /tmp/harness.S

      - name: Execute original routine and report metadata only
        shell: bash
        run: |
          set -euo pipefail
          qemu-m68k /tmp/harness-m68k > /tmp/trace.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          data=Path('/tmp/trace.bin').read_bytes()
          pos=0
          case_info={
              1:('0x3a7fe','0x16943c','0xff316c'),
              2:('0x3e820','0x141580','0xff2fa8'),
          }
          while pos < len(data):
              if pos+16 > len(data): raise SystemExit('truncated trace header')
              magic,case_id,out_len,consumed=struct.unpack('>IIII',data[pos:pos+16])
              pos += 16
              if magic != 0x54485232: raise SystemExit(f'bad trace magic {magic:08x}')
              if pos+out_len > len(data): raise SystemExit('truncated trace output')
              out=data[pos:pos+out_len]
              pos += out_len
              caller,source,dest=case_info[case_id]
              print(f'case={case_id}')
              print(f'caller={caller}')
              print(f'source_rom_address={source}')
              print(f'destination_original={dest}')
              print(f'source_consumed={consumed}')
              print(f'output_length={out_len}')
              print(f'output_sha256={hashlib.sha256(out).hexdigest()}')
          if pos != len(data): raise SystemExit('trace parse mismatch')
          PY
