name: m3-3820-dynamic-trace

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  trace-original-decompressor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Prepare one proven source for each format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          Path('/tmp/decompress.bin').write_bytes(rom[0x3820:0x3b3e])
          cases={
              'a': (0x00c394, 0x16943c, 0xff2fa8),
              'b': (0x03c276, 0x1894ea, 0xff3fac),
          }
          for name,(call,src,dst) in cases.items():
              flag=rom[src+2]
              if name=='a' and flag==0: raise SystemExit('format-A selector unexpectedly zero')
              if name=='b' and flag!=0: raise SystemExit('format-B selector unexpectedly nonzero')
              Path(f'/tmp/source_{name}.bin').write_bytes(rom[src:src+0x20000])
              Path(f'/tmp/case_{name}.txt').write_text(f'{call:x} {src:x} {dst:x} {flag}\n')
              print(f'selected_{name}: caller=0x{call:x} source=0x{src:x} dest=0x{dst:x} source_byte_2={flag}')
          PY

      - name: Install M68K compiler and QEMU user emulator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-m68k-linux-gnu binutils-m68k-linux-gnu qemu-user

      - name: Build isolated M68K harness around original routine bytes
        shell: bash
        run: |
          cat >/tmp/harness.S <<'ASM'
          .section .text
          .global _start

          run_case:
              lea output_data,%a1
              move.l %a0,%a3
              move.l %a1,%a4
              move.l %d7,%a6
              jsr original_decompressor
              move.l %a6,%d7
              move.l %a0,%d4
              sub.l %a3,%d4
              move.l %a1,%d5
              sub.l %a4,%d5
              lea metadata,%a5
              move.l #0x54485234,(%a5)
              move.l %d7,4(%a5)
              move.l %d5,8(%a5)
              move.l %d4,12(%a5)
              move.l #4,%d0
              move.l #1,%d1
              move.l %a5,%d2
              move.l #16,%d3
              trap #0
              move.l #4,%d0
              move.l #1,%d1
              move.l %a4,%d2
              move.l %d5,%d3
              trap #0
              rts

          _start:
              lea source_a,%a0
              moveq #1,%d7
              bsr run_case
              lea source_b,%a0
              moveq #2,%d7
              bsr run_case
              move.l #1,%d0
              clr.l %d1
              trap #0

          .align 2
          original_decompressor:
              .incbin "/tmp/decompress.bin"

          .section .rodata
          .align 2
          source_a:
              .incbin "/tmp/source_a.bin"
          source_b:
              .incbin "/tmp/source_b.bin"

          .section .bss
          .align 4
          output_data:
              .skip 4194304
          metadata:
              .skip 16
          ASM
          m68k-linux-gnu-gcc -nostdlib -static -Wl,-e,_start -o /tmp/harness-m68k /tmp/harness.S

      - name: Execute original routine and verify oracle metadata
        shell: bash
        run: |
          set -euo pipefail
          qemu-m68k /tmp/harness-m68k > /tmp/trace.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          expected={
              1:(1217,3072,'65e99e74020fedbdcb97c8249a5ccfe540aca5bb5d29bfb260352cd6f388c31a'),
              2:(112,128,'167d4e5409f6b075b3b6f2bc61dbb747e8d8c857e8699745184ddf48d83bcda9'),
          }
          data=Path('/tmp/trace.bin').read_bytes(); pos=0
          while pos < len(data):
              magic,case_id,out_len,consumed=struct.unpack('>IIII',data[pos:pos+16]); pos+=16
              if magic!=0x54485234: raise SystemExit('bad trace magic')
              out=data[pos:pos+out_len]; pos+=out_len
              digest=hashlib.sha256(out).hexdigest()
              print(f'original case={case_id} consumed={consumed} output={out_len} sha256={digest}')
              if (consumed,out_len,digest)!=expected[case_id]: raise SystemExit('original oracle changed')
          PY

      - name: Compare native C++ translation against both original traces
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/native_check.cpp <<'CPP'
          #include "game/graphics_decompress.hpp"
          #include <cstdint>
          #include <fstream>
          #include <iostream>
          #include <iterator>
          #include <string>
          #include <vector>

          int main() {
              std::ifstream file("/tmp/reference.md", std::ios::binary);
              std::vector<std::uint8_t> rom{std::istreambuf_iterator<char>(file), {}};
              struct Case { const char* name; std::size_t address; };
              const Case cases[]{{"a", 0x16943c}, {"b", 0x1894ea}};
              for (const auto& c : cases) {
                  std::vector<std::uint8_t> out(4 * 1024 * 1024);
                  auto source = std::span<const std::uint8_t>(rom).subspan(c.address);
                  const auto result = oasis::game::decompress_graphics(source, out);
                  std::ofstream output(std::string("/tmp/native_") + c.name + ".bin", std::ios::binary);
                  output.write(reinterpret_cast<const char*>(out.data()), static_cast<std::streamsize>(result.output_size));
                  std::cout << c.name << " consumed=" << result.source_consumed
                            << " output=" << result.output_size << '\n';
              }
          }
          CPP
          c++ -std=c++20 -Isrc /tmp/native_check.cpp src/game/graphics_decompress.cpp -o /tmp/native_check
          /tmp/native_check | tee /tmp/native_meta.txt
          grep -qx 'a consumed=1217 output=3072' /tmp/native_meta.txt
          grep -qx 'b consumed=112 output=128' /tmp/native_meta.txt
          test "$(sha256sum /tmp/native_a.bin | awk '{print $1}')" = "65e99e74020fedbdcb97c8249a5ccfe540aca5bb5d29bfb260352cd6f388c31a"
          test "$(sha256sum /tmp/native_b.bin | awk '{print $1}')" = "167d4e5409f6b075b3b6f2bc61dbb747e8d8c857e8699745184ddf48d83bcda9"
