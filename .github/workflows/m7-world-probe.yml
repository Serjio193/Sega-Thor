name: m7-world-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  discover-world-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Find absolute references to collision candidate RAM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          for target in (0xff179e,0xff17a2,0xff138c,0xff16ec,0xff16fa):
              pat=target.to_bytes(4,'big')
              hits=[]; p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  hits.append(p); p+=1
              print(f'refs_0x{target:06x}_count={len(hits)} offsets='+','.join(f'0x{x:06x}' for x in hits[:120]))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble candidate RAM readers and writers
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0x00ce80 0x00cf80' \
            '0x00d740 0x00d880' \
            '0x00d980 0x00db40' \
            '0x00e000 0x00e220' \
            '0x00f000 0x00f300' \
            '0x010000 0x010300'; do
            set -- $RANGE
            echo "===== candidate $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Find coordinate-shaped accesses near candidate buffers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          targets=[0xff179e,0xff17a2,0xff138c]
          refs=[]
          for target in targets:
              pat=target.to_bytes(4,'big')
              p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  refs.append((p,target)); p+=1
          for pos,target in refs:
              start=max(0,pos-48); end=min(len(rom),pos+64)
              print(f'window target=0x{target:06x} ref=0x{pos:06x} bytes={rom[start:end].hex()}')
          PY
