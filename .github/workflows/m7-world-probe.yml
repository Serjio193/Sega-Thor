name: m7-world-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  discover-world-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Locate candidate 26-byte screen descriptors and pointer tables
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          # Candidate descriptor starts are exactly 26 bytes before setup code that calls D406.
          candidates=[0x02cf82,0x02d3e8,0x032144,0x03285c]
          for addr in candidates:
              raw=rom[addr:addr+26]
              print(f'descriptor=0x{addr:06x} bytes={raw.hex()}')
              for width in (3,4):
                  pat=addr.to_bytes(width,'big')
                  hits=[]; p=0
                  while True:
                      p=rom.find(pat,p)
                      if p<0: break
                      hits.append(p); p+=1
                  print(f' refs_width_{width}=',','.join(f'0x{x:06x}' for x in hits[:80]))

          # Search for dense runs of 4-byte pointers into the screen-code region.
          lo,hi=0x02c000,0x03b000
          runs=[]
          start=None; count=0
          for off in range(0,len(rom)-4,4):
              v=int.from_bytes(rom[off:off+4],'big')
              valid=lo <= v < hi
              if valid:
                  if start is None: start=off; count=0
                  count+=1
              else:
                  if start is not None and count>=4: runs.append((start,count))
                  start=None; count=0
          if start is not None and count>=4: runs.append((start,count))
          print('dense_screen_code_pointer_runs=',len(runs))
          for start,count in sorted(runs,key=lambda x:x[1],reverse=True)[:30]:
              vals=[int.from_bytes(rom[start+i*4:start+i*4+4],'big') for i in range(min(count,12))]
              print(f'run=0x{start:06x} count={count} first='+','.join(f'0x{x:06x}' for x in vals))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble candidate descriptor setup blocks
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0x02cf70 0x02cfd0' \
            '0x02d3d0 0x02d440' \
            '0x032130 0x0321a0' \
            '0x032840 0x0328b0' \
            '0x00d400 0x00d540'; do
            set -- $RANGE
            echo "===== candidate $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Correlate developer screen names with descriptor-like pointer runs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          rom=Path('/tmp/reference.md').read_bytes()
          start=rom.find(b'VILLAGE'); end=rom.find(b'14-01 KING',start)+len(b'14-01 KING')
          runs=[m.group().decode('ascii',errors='replace') for m in re.finditer(rb'[ -~]{3,}',rom[start:end])]
          print('developer_screen_printable_count=',len(runs))
          print('screen_samples=', ' | '.join(f'{i}:{runs[i]}' for i in [0,1,2,3,4,27,35,36,87,107] if i<len(runs)))
          PY
