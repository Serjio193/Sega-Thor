name: m7-world-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  discover-world-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Inspect indexed compressed-resource table
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          base=0x05ce96
          values=[int.from_bytes(rom[base+i*4:base+i*4+4],'big') for i in range(108)]
          print('table_base=0x05ce96 entries=108 first_null=', values[0]==0)
          for i,v in enumerate(values[:16]):
              print(f'entry={i:03d} value=0x{v:06x}')

          for target in (0x00d3b2,0x00d406,0x05ce96):
              patterns=[bytes.fromhex('4eb9')+target.to_bytes(4,'big'), bytes.fromhex('4ef9')+target.to_bytes(4,'big')]
              hits=[]
              for pat in patterns:
                  p=0
                  while True:
                      p=rom.find(pat,p)
                      if p<0: break
                      hits.append(p); p+=1
              print(f'abs_calls_or_jumps_to_0x{target:06x}=', ','.join(f'0x{x:06x}' for x in sorted(set(hits))))

          for text in (b'VILLAGE',b'ECAPITAL',b'HARBOR',b'01-00',b'01-05 BOSS',b'14-01 KING'):
              hits=[]; p=0
              while True:
                  p=rom.find(text,p)
                  if p<0: break
                  hits.append(p); p+=1
              print(text.decode(), 'hits=', ','.join(f'0x{x:06x}' for x in hits))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble table reader and its likely callers
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0x00d300 0x00d700' \
            '0x00ce80 0x00cf80' \
            '0x02da80 0x02dc20' \
            '0x02f620 0x02f760'; do
            set -- $RANGE
            echo "===== candidate $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Find immediate D0 setup before calls to 0xD3B2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          call=bytes.fromhex('4eb90000d3b2')
          pos=0
          while True:
              pos=rom.find(call,pos)
              if pos<0: break
              start=max(0,pos-24)
              print(f'call_0xd3b2=0x{pos:06x} preceding={rom[start:pos].hex()}')
              pos+=1
          PY
