name: m7-world-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  discover-world-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Inspect screen group table and resolve known descriptors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          base=0x00c92c
          groups=[int.from_bytes(rom[base+i*4:base+i*4+4],'big') for i in range(21)]
          print('group_table=0x00c92c entries=21')
          for i,v in enumerate(groups):
              print(f'group={i:02x} base=0x{v:06x}')

          targets={0x02cf82,0x02d3e8,0x032144,0x03285c}
          found={}
          for group,group_base in enumerate(groups):
              # Probe all byte-sized screen indices exactly as C8F0/C8FC does.
              for index in range(256):
                  entry=group_base+index*2
                  if entry+2>len(rom): break
                  rel=int.from_bytes(rom[entry:entry+2],'big',signed=True)
                  descriptor=entry+rel
                  if descriptor in targets:
                      found[descriptor]=(group,index,entry,rel)
          for descriptor in sorted(targets):
              if descriptor not in found:
                  print(f'descriptor=0x{descriptor:06x} screen_id=NOT_FOUND')
                  continue
              group,index,entry,rel=found[descriptor]
              print(f'descriptor=0x{descriptor:06x} screen_id=0x{group:02x}{index:02x} entry=0x{entry:06x} rel={rel}')

          # Print a few low IDs for each group while resolved addresses remain in ROM.
          for group,group_base in enumerate(groups):
              row=[]
              for index in range(8):
                  entry=group_base+index*2
                  rel=int.from_bytes(rom[entry:entry+2],'big',signed=True)
                  descriptor=entry+rel
                  row.append(f'{group:02x}{index:02x}->0x{descriptor:06x}')
              print('sample_ids', ' '.join(row))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble screen dispatcher
        shell: bash
        run: |
          m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
            --start-address=0x00c8aa --stop-address=0x00c9b2 /tmp/reference.md

      - name: Inspect candidate descriptors structurally
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          for addr in (0x02cf82,0x02d3e8,0x032144,0x03285c):
              raw=rom[addr:addr+26]
              ptr=int.from_bytes(raw[4:8],'big')
              ids=list(raw[8:12])
              signed=[x if x<128 else x-256 for x in raw[12:16]]
              words=[int.from_bytes(raw[o:o+2],'big') for o in (16,18,20,22,24)]
              init=int.from_bytes(rom[addr+26:addr+30],'big')
              print(f'descriptor=0x{addr:06x} ptr4=0x{ptr:06x} resource_ids={ids} signed12_15={signed} words16_24={words} init=0x{init:06x}')
          PY
