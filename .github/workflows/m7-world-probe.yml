name: m7-world-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  discover-world-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Inventory decompressor call inputs and destinations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          jsr=bytes.fromhex('4eb900003820')
          pos=0
          rows=[]
          while True:
              call=rom.find(jsr,pos)
              if call<0: break
              pos=call+1
              start=max(0,call-96)
              window=rom[start:call]
              def last_abs(opcode):
                  p=window.rfind(opcode)
                  if p<0 or p+6>len(window): return None
                  return int.from_bytes(window[p+2:p+6],'big')
              src=last_abs(bytes.fromhex('41f9'))
              dst=last_abs(bytes.fromhex('43f9'))
              flag=None if src is None or src+2>=len(rom) else rom[src+2]
              rows.append((call,src,dst,flag))
          for call,src,dst,flag in rows:
              print(f'call=0x{call:06x} src={"?" if src is None else f"0x{src:06x}"} '
                    f'dst={"?" if dst is None else f"0x{dst:06x}"} selector={flag}')
          print(f'total_calls={len(rows)}')
          PY

      - name: Find dense ROM pointer-table candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          lo=0x40000
          hi=len(rom)
          candidates=[]
          i=0x400
          while i+24<=len(rom):
              vals=[]
              j=i
              while j+4<=len(rom):
                  v=int.from_bytes(rom[j:j+4],'big')
                  if not (lo <= v < hi and (v & 1)==0): break
                  vals.append(v); j+=4
              if len(vals)>=6:
                  unique=len(set(vals))
                  spread=max(vals)-min(vals)
                  if unique>=4 and spread>16:
                      candidates.append((len(vals),i,vals[:8]))
                  i=j
              else:
                  i+=2
          candidates.sort(reverse=True)
          print(f'pointer_table_candidates={len(candidates)}')
          for count,addr,vals in candidates[:60]:
              print(f'table=0x{addr:06x} count={count} first=' + ','.join(f'0x{x:06x}' for x in vals))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble candidate loader neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          # These ranges contain clusters of decompressor calls and are discovery targets only.
          for RANGE in \
            '0x2a600 0x2a740' \
            '0x2b160 0x2b260' \
            '0x2daE0 0x2dc00' \
            '0x2f620 0x2f720' \
            '0x3bfE0 0x3c360' \
            '0x3c520 0x3c700' \
            '0x3c920 0x3ca80' \
            '0x3cb40 0x3cd40' \
            '0x3ce00 0x3d100'; do
            set -- $RANGE
            echo "===== candidate $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done
