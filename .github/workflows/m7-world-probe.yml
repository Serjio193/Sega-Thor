name: m7-world-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  discover-world-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Correlate indexed resource table and developer screen list
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          rom=Path('/tmp/reference.md').read_bytes()
          base=0x05ce96
          values=[int.from_bytes(rom[base+i*4:base+i*4+4],'big') for i in range(108)]
          print('table_base=0x05ce96 entries=108 first_null=', values[0]==0)
          for i in (0,1,2,3,4,0x23,0x24,0x57,107):
              print(f'table_entry={i:03d} value=0x{values[i]:06x}')

          # The ROM contains a developer-facing screen-name list beginning at VILLAGE.
          start=rom.find(b'VILLAGE')
          end=rom.find(b'14-01 KING', start)
          end=end+len(b'14-01 KING') if end>=0 else start+0x800
          blob=rom[start:end]
          runs=[m.group().decode('ascii') for m in re.finditer(rb'[ -~]{3,}', blob)]
          print(f'screen_list_start=0x{start:06x} end=0x{end:06x} printable_runs={len(runs)}')
          for i,name in enumerate(runs):
              print(f'screen_name_index={i:03d} name={name}')
          for wanted in (3,4,0x23,0x24,0x57):
              if wanted < len(runs):
                  print(f'index_match={wanted:03d} name={runs[wanted]} table_ptr=0x{values[wanted]:06x}')

          for target in (0x00d3b2,0x00d406):
              pat=bytes.fromhex('4eb9')+target.to_bytes(4,'big')
              hits=[]; p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  hits.append(p); p+=1
              print(f'jsr_to_0x{target:06x}=', ','.join(f'0x{x:06x}' for x in hits))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble all direct callers of indexed resource loader
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0x02cf60 0x02cff0' \
            '0x02d3c0 0x02d450' \
            '0x032130 0x0321c0' \
            '0x032840 0x0328d0' \
            '0x00d3a0 0x00d700'; do
            set -- $RANGE
            echo "===== candidate $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Decode immediate D0 values before calls to 0xD3B2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          call=bytes.fromhex('4eb90000d3b2')
          pos=0
          while True:
              pos=rom.find(call,pos)
              if pos<0: break
              # MOVE.W #imm,D0 is 0x303c xxxx. Search only the final 20 bytes.
              window=rom[max(0,pos-20):pos]
              p=window.rfind(bytes.fromhex('303c'))
              imm=None if p<0 or p+4>len(window) else int.from_bytes(window[p+2:p+4],'big')
              print(f'call=0x{pos:06x} immediate_d0={"unknown" if imm is None else str(imm)}')
              pos+=1
          PY
