name: m7-world-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  discover-world-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM temporarily
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' > /tmp/beyond-oasis.zip
          mkdir -p /tmp/reference-rom
          unzip -q /tmp/beyond-oasis.zip -d /tmp/reference-rom
          ROM="$(find /tmp/reference-rom -type f | head -n 1)"
          test "$(stat -c%s "$ROM")" = "3145728"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Inspect dispatch table at 0xC928
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          base=0x00c928
          values=[int.from_bytes(rom[base+i*4:base+i*4+4],'big') for i in range(22)]
          print('dispatch_base=0x00c928 entries=22')
          for i,v in enumerate(values):
              print(f'dispatch_entry={i:02d} target=0x{v:06x}')
          for width in (3,4):
              pat=base.to_bytes(width,'big')
              hits=[]; p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  hits.append(p); p+=1
              print(f'refs_width_{width}_to_dispatch=',','.join(f'0x{x:06x}' for x in hits[:100]))
          for target in values:
              pat=target.to_bytes(4,'big')
              hits=[]; p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  hits.append(p); p+=1
              if hits:
                  print(f'refs_to_target_0x{target:06x}=',','.join(f'0x{x:06x}' for x in hits[:20]))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble dispatch reader neighborhood
        shell: bash
        run: |
          m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
            --start-address=0x00c860 --stop-address=0x00ca80 /tmp/reference.md

      - name: Disassemble all dispatch targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          base=0x00c928
          vals=[int.from_bytes(rom[base+i*4:base+i*4+4],'big') for i in range(22)]
          Path('/tmp/targets.txt').write_text('\n'.join(f'{v:06x}' for v in vals))
          PY
          while read -r TARGET; do
            START=$((0x$TARGET))
            END=$((START+0x90))
            printf '===== target 0x%06x..0x%06x =====\n' "$START" "$END"
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$START --stop-address=$END /tmp/reference.md
          done </tmp/targets.txt

      - name: Inspect candidate 26-byte descriptors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          for addr in (0x02cf82,0x02d3e8,0x032144,0x03285c):
              raw=rom[addr:addr+26]
              ptr=int.from_bytes(raw[4:8],'big')
              ids=list(raw[8:12])
              signed=[x if x<128 else x-256 for x in raw[12:16]]
              words=[int.from_bytes(raw[o:o+2],'big') for o in (16,18,20,22,24)]
              print(f'descriptor=0x{addr:06x} ptr4=0x{ptr:06x} resource_ids={ids} signed12_15={signed} words16_24={words}')
          PY
