name: m8-player-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  trace-player-input:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' >/tmp/beyond.zip
          mkdir -p /tmp/rom && unzip -q /tmp/beyond.zip -d /tmp/rom
          ROM="$(find /tmp/rom -type f | head -n1)"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Decode pad poll and post-processing
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in '0x000b90 0x000c90' '0x000240 0x0002c0' '0x000e20 0x000eb0' '0x001600 0x0016f0'; do
            set -- $RANGE
            echo "===== $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Find pad-state RAM consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          rom=Path('/tmp/reference.md').read_bytes()
          hits=[]
          for target in range(0xff1512,0xff1518):
              pat=target.to_bytes(4,'big'); p=0; one=[]
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  one.append(p); hits.append((p,target)); p+=1
              print(f'ram_0x{target:06x}_refs=' + ','.join(f'0x{x:06x}' for x in one))
          for p,target in sorted(hits):
              start=max(0,p-0x50); end=min(len(rom),p+0x80)
              print(f'===== RAM ref 0x{p:06x} -> 0x{target:06x} =====')
              print(subprocess.check_output([
                  'm68k-linux-gnu-objdump','-D','-b','binary','-m','m68k:68000','--adjust-vma=0',
                  f'--start-address={start}',f'--stop-address={end}','/tmp/reference.md'
              ],text=True))
          PY

      - name: Decode movement entry 0x8F0C
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in '0x008ee0 0x008f90' '0x038a60 0x038b60' '0x011e70 0x011ef0'; do
            set -- $RANGE
            echo "===== $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Trace callers around 0x38ADC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          for target in (0x38a60,0x38a80,0x38aa0,0x38ac0,0x38adc,0x38d22,0x8f0c):
              refs=[]
              pat=b'\x4e\xb9'+target.to_bytes(4,'big'); p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  refs.append(('JSR.L',p)); p+=1
              for p in range(0,len(rom)-4,2):
                  if rom[p:p+2] != b'\x61\x00': continue
                  disp=int.from_bytes(rom[p+2:p+4],'big',signed=True)
                  if p+4+disp == target: refs.append(('BSR.W',p))
              print(f'target=0x{target:06x} refs=' + ','.join(f'{k}@0x{p:06x}' for k,p in sorted(refs,key=lambda x:x[1])))
          PY
