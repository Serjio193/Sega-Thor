name: m8-player-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  trace-player-input:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' >/tmp/beyond.zip
          mkdir -p /tmp/rom && unzip -q /tmp/beyond.zip -d /tmp/rom
          ROM="$(find /tmp/rom -type f | head -n1)"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Build instruction-level disassembly
        shell: bash
        run: |
          m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 /tmp/reference.md > /tmp/reference.dis
          wc -l /tmp/reference.dis

      - name: Find real controller I/O instructions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/reference.dis').read_text(errors='replace').splitlines()
          keys=('a10003','a10005','a10009','a1000b','a1000d','a10000')
          hits=[]
          for i,line in enumerate(lines):
              low=line.lower().replace(' ','')
              if any(k in low for k in keys): hits.append(i)
          print(f'controller_instruction_hits={len(hits)}')
          for i in hits:
              print('===== controller instruction =====')
              for line in lines[max(0,i-12):min(len(lines),i+18)]: print(line)
          PY

      - name: Find instruction-level movement-cluster calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/reference.dis').read_text(errors='replace').splitlines()
          found=[]
          for i,line in enumerate(lines):
              m=re.search(r'^\s*([0-9a-f]+):.*\b(?:jsr|bsr\w*|jmp)\s+0x([0-9a-f]+)\b',line,re.I)
              if not m: continue
              src=int(m.group(1),16); dst=int(m.group(2),16)
              if 0x8ef8 <= dst < 0xa100 and not (0x8ef8 <= src < 0xa100):
                  found.append((i,src,dst))
          print(f'external_movement_calls={len(found)}')
          for i,src,dst in found:
              print(f'===== external call 0x{src:06x} -> 0x{dst:06x} =====')
              for line in lines[max(0,i-10):min(len(lines),i+14)]: print(line)
          PY

      - name: Find RAM addresses referenced by real controller routine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/reference.dis').read_text(errors='replace').splitlines()
          controller=[]
          for i,line in enumerate(lines):
              low=line.lower().replace(' ','')
              if any(k in low for k in ('a10003','a10005','a10009','a1000b','a1000d')):
                  controller.append(i)
          windows=set()
          for i in controller:
              for j in range(max(0,i-30),min(len(lines),i+60)): windows.add(j)
          refs={}
          for j in sorted(windows):
              for x in re.findall(r'0xff[0-9a-f]{4}',lines[j].lower()):
                  refs.setdefault(x,[]).append(j)
          for addr,idxs in sorted(refs.items()):
              print(f'candidate_input_ram={addr} occurrences={len(idxs)}')
              for j in idxs[:4]: print('  '+lines[j])
          PY

      - name: Decode verified movement core start
        shell: bash
        run: |
          m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
            --start-address=0x8ef8 --stop-address=0x93a0 /tmp/reference.md
