name: m7-collision-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  inspect-collision-readers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' >/tmp/beyond.zip
          mkdir -p /tmp/rom && unzip -q /tmp/beyond.zip -d /tmp/rom
          ROM="$(find /tmp/rom -type f | head -n1)"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Locate exact callers of 0x10594
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          target=0x10594
          calls=[]
          pat=b'\x4e\xb9'+target.to_bytes(4,'big')
          p=0
          while True:
              p=rom.find(pat,p)
              if p < 0: break
              calls.append((p,'JSR.L')); p += 1
          for p in range(0,len(rom)-4,2):
              if rom[p:p+2] != b'\x61\x00': continue
              disp=int.from_bytes(rom[p+2:p+4],'big',signed=True)
              if p+4+disp == target: calls.append((p,'BSR.W'))
          print('calls_10594=' + ','.join(f'{kind}@0x{p:06x}' for p,kind in sorted(calls)))
          for p,kind in sorted(calls):
              start=max(0,p-48); end=min(len(rom),p+48)
              print(f'caller_window {kind}@0x{p:06x}=' + rom[start:end].hex())
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble spatial query and known gameplay callers
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0x010540 0x010720' \
            '0x022780 0x022820' \
            '0x027090 0x027110'; do
            set -- $RANGE
            echo "===== $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Inventory memory references used by 0x10594 neighborhood
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          start,end=0x10594,0x10720
          block=rom[start:end]
          for target in range(0xff0000,0x1000000):
              pass
          # Exact absolute-RAM constants actually present in the function bytes.
          found=[]
          for i in range(len(block)-3):
              v=int.from_bytes(block[i:i+4],'big')
              if 0xff0000 <= v <= 0xffffff:
                  found.append((start+i,v))
          seen=set()
          for pos,v in found:
              if (pos,v) in seen: continue
              seen.add((pos,v))
              print(f'ram_ref@0x{pos:06x}=0x{v:06x}')
          PY
