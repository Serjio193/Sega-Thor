name: m7-collision-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  inspect-collision-readers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' >/tmp/beyond.zip
          mkdir -p /tmp/rom && unzip -q /tmp/beyond.zip -d /tmp/rom
          ROM="$(find /tmp/rom -type f | head -n1)"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Dump terrain lookup tables
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          for base,name in ((0x96e8,'terrain_state'),(0x96f8,'terrain_behavior')):
              raw=rom[base:base+16]
              signed=[b if b < 128 else b-256 for b in raw]
              print(f'{name}_table@0x{base:06x}_hex=' + raw.hex())
              for i,(u,s) in enumerate(zip(raw,signed)):
                  print(f'{name}[{i:02x}]=0x{u:02x} signed={s}')
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble terrain samplers and movement integration
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0x009a80 0x009c90' \
            '0x009be0 0x009d80' \
            '0x008f80 0x009180'; do
            set -- $RANGE
            echo "===== $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Trace callers of terrain routines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          targets=(0x9ad6,0x9bc2,0x9bf2,0x9c40,0x9d00,0x9d4e,0x9dd6)
          for target in targets:
              refs=[]
              pat=b'\x4e\xb9'+target.to_bytes(4,'big')
              p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  refs.append(('JSR.L',p)); p+=1
              for p in range(0,len(rom)-4,2):
                  if rom[p:p+2] != b'\x61\x00': continue
                  disp=int.from_bytes(rom[p+2:p+4],'big',signed=True)
                  if p+4+disp == target:
                      refs.append(('BSR.W',p))
              print(f'target=0x{target:06x} refs=' + ','.join(f'{k}@0x{p:06x}' for k,p in sorted(refs,key=lambda x:x[1])))
          PY

      - name: Inventory terrain-code tests in movement cluster
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          start,end=0x8f00,0x9e40
          block=rom[start:end]
          for code in range(16):
              # Report immediate byte/word occurrences only as search anchors;
              # disassembly above determines whether they are actual compares/tests.
              hits=[]
              for pat in (bytes((code,)), code.to_bytes(2,'big')):
                  p=0
                  while True:
                      p=block.find(pat,p)
                      if p<0: break
                      hits.append(start+p); p+=1
              print(f'code_{code:02x}_anchors=' + ','.join(f'0x{x:06x}' for x in sorted(set(hits))[:80]))
          PY
