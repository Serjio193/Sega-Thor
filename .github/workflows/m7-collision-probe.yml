name: m7-collision-probe

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  inspect-collision-readers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' >/tmp/beyond.zip
          mkdir -p /tmp/rom && unzip -q /tmp/beyond.zip -d /tmp/rom
          ROM="$(find /tmp/rom -type f | head -n1)"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Dump terrain support tables
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          for base,length,name in (
              (0x96e8,16,'terrain_state'),
              (0x96f8,16,'terrain_behavior'),
              (0x5d706,64,'height_or_motion_lut_head')):
              raw=rom[base:base+length]
              print(f'{name}@0x{base:06x}=' + raw.hex())
          # FF1706 is runtime RAM, so locate code that populates it instead of pretending
          # its values are static ROM data.
          for target in (0xff1706,):
              pat=target.to_bytes(4,'big')
              hits=[]; p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  hits.append(p); p+=1
              print('refs_FF1706=' + ','.join(f'0x{x:06x}' for x in hits))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble movement gate and its immediate call sites
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0x009340 0x009490' \
            '0x009480 0x009710' \
            '0x009d40 0x009f20' \
            '0x009080 0x009230'; do
            set -- $RANGE
            echo "===== $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done

      - name: Find exact callers of 0x938e and nearby helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          targets=(0x938e,0x9ad6,0x9bf2,0x9d4e,0x9dd6,0x9eba)
          for target in targets:
              refs=[]
              pat=b'\x4e\xb9'+target.to_bytes(4,'big')
              p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  refs.append(('JSR.L',p)); p+=1
              for p in range(0,len(rom)-4,2):
                  if rom[p:p+2] != b'\x61\x00': continue
                  disp=int.from_bytes(rom[p+2:p+4],'big',signed=True)
                  if p+4+disp == target:
                      refs.append(('BSR.W',p))
              print(f'target=0x{target:06x} refs=' + ','.join(f'{k}@0x{p:06x}' for k,p in sorted(refs,key=lambda x:x[1])))
          PY

      - name: Locate writes and reads of entity terrain fields
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          # Fields +110/+111/+112 and +20 are relative to FP, so scan the movement
          # cluster for their displacement words and keep output as navigation anchors.
          block=rom[0x8f00:0xa100]
          for field in (20,64,65,70,110,111,112,114,118):
              pat=field.to_bytes(2,'big')
              hits=[]; p=0
              while True:
                  p=block.find(pat,p)
                  if p<0: break
                  hits.append(0x8f00+p); p+=1
              print(f'field_plus_{field}_anchors=' + ','.join(f'0x{x:06x}' for x in hits[:120]))
          PY
