name: m7-loader-callgraph

on:
  push:
    branches: [oasis-cpp-bootstrap]
  workflow_dispatch:

jobs:
  trace-loader-callgraph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain verified reference ROM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show 'origin/main:Beyond Oasis (USA).zip' >/tmp/beyond.zip
          mkdir -p /tmp/rom && unzip -q /tmp/beyond.zip -d /tmp/rom
          ROM="$(find /tmp/rom -type f | head -n1)"
          test "$(sha1sum "$ROM" | awk '{print $1}')" = "2944910c07c02eace98c17d78d07bef7859d386a"
          cp "$ROM" /tmp/reference.md

      - name: Find direct JSR and BSR references to loader routines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom=Path('/tmp/reference.md').read_bytes()
          targets=[0xD3B2,0xD406,0xD4C8,0xD542,0xD7B0,0xD7C0]
          refs={t:[] for t in targets}

          for t in targets:
              pat=b'\x4e\xb9'+t.to_bytes(4,'big')
              p=0
              while True:
                  p=rom.find(pat,p)
                  if p<0: break
                  refs[t].append(('JSR.L',p)); p+=1
              if t <= 0xffff:
                  pat=b'\x4e\xb8'+t.to_bytes(2,'big')
                  p=0
                  while True:
                      p=rom.find(pat,p)
                      if p<0: break
                      refs[t].append(('JSR.W',p)); p+=1

          for a in range(0,len(rom)-4,2):
              op=int.from_bytes(rom[a:a+2],'big')
              if (op & 0xff00) != 0x6100: continue
              d8=op & 0xff
              if d8==0:
                  disp=int.from_bytes(rom[a+2:a+4],'big',signed=True)
                  target=(a+4+disp)&0xffffffff
                  kind='BSR.W'
              elif d8==0xff:
                  continue
              else:
                  disp=d8 if d8<0x80 else d8-0x100
                  target=a+2+disp
                  kind='BSR.S'
              if target in refs: refs[target].append((kind,a))

          for t in targets:
              items=sorted(set(refs[t]),key=lambda x:x[1])
              print(f'target=0x{t:06x} count={len(items)} refs=' + ','.join(f'{k}@0x{a:06x}' for k,a in items))
          PY

      - name: Install M68K binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-m68k-linux-gnu

      - name: Disassemble loader helpers and surrounding orchestration
        shell: bash
        run: |
          set -euo pipefail
          for RANGE in \
            '0xd720 0xd850' \
            '0xcf00 0xd180' \
            '0xd000 0xd300' \
            '0xd700 0xda00'; do
            set -- $RANGE
            echo "===== $1..$2 ====="
            m68k-linux-gnu-objdump -D -b binary -m m68k:68000 --adjust-vma=0 \
              --start-address=$1 --stop-address=$2 /tmp/reference.md
          done
